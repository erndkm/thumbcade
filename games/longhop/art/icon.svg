<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Three spot inks on warm paper: orange #FF6C2F, federal blue #3D5588, sunflower #FFB511.
       Overprints are their multiply mixes; tints are halftone dots; the blue plate sits a hair off register. -->
  <defs>
    <pattern id="skyDots" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="11" cy="11" r="4.6" fill="#3D5588"/>
    </pattern>
    <pattern id="skyWarm" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="11" cy="11" r="5.4" fill="#FFB511"/>
    </pattern>
    <pattern id="skyLow" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="11" cy="11" r="5" fill="#FF6C2F"/>
    </pattern>
    <pattern id="sunRed" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="10" cy="10" r="6.2" fill="#FF4D03"/>
    </pattern>
    <pattern id="mesaDots" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="10" cy="10" r="7" fill="#3D5588" fill-opacity="0.85"/>
    </pattern>
    <!-- In the kangaroo's own units (it is drawn at 8.6×): 18 px cells on the page. -->
    <pattern id="rooShade" width="2.093" height="2.093" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="1.047" cy="1.047" r="0.66" fill="#3D2419"/>
    </pattern>
    <pattern id="earthDots" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="10" cy="10" r="4.4" fill="#3D2419"/>
    </pattern>
    <pattern id="shadowDots" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="9" cy="9" r="6.4" fill="#3D2419"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.953  0 0 0 0 0.929  0 0 0 0 0.878  0 0 0 2.2 -1.42"/>
    </filter>
    <clipPath id="sunClip"><circle cx="560" cy="480" r="318"/></clipPath>

    <!-- The kangaroo, mid-bound, in its own units (feet at the origin), drawn at 8.6×. -->
