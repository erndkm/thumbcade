L22.35 -50.02 L23.28 -49.50 L24.08 -48.84 L24.72 -48.06 L25.19 -47.19 Z M30.32 -42.53 L30.15 -41.98 L29.83 -41.47 L29.38 -41.02 L28.80 -40.65 L28.13 -40.35 L27.37 -40.15 L26.55 -40.05 L25.69 -40.05 L24.83 -40.15 L23.98 -40.35 L23.18 -40.64 L22.44 -41.02 L21.80 -41.47 L21.26 -41.98 L20.85 -42.53 L20.58 -43.10 L20.45 -43.69 L20.48 -44.27 L20.65 -44.82 L20.97 -45.33 L21.42 -45.78 L22.00 -46.15 L22.67 -46.45 L23.43 -46.65 L24.25 -46.75 L25.11 -46.75 L25.97 -46.65 L26.82 -46.45 L27.62 -46.16 L28.36 -45.78 L29.00 -45.33 L29.54 -44.82 L29.95 -44.27 L30.22 -43.70 L30.35 -43.11 Z M11.78 -59.89 L12.25 -59.97 L12.79 -59.84 L13.38 -59.53 L14.00 -59.02 L14.63 -58.35 L15.26 -57.52 L15.86 -56.57 L16.41 -55.52 L16.90 -54.41 L17.32 -53.27 L17.65 -52.13 L17.88 -51.03 L18.00 -50.00 L18.02 -49.08 L17.92 -48.28 L17.72 -47.65 L17.42 -47.18 L17.02 -46.91 L16.55 -46.83 L16.01 -46.96 L15.42 -47.27 L14.80 -47.78 L14.17 -48.45 L13.54 -49.28 L12.94 -50.23 L12.39 -51.28 L11.90 -52.39 L11.48 -53.53 L11.15 -54.67 L10.92 -55.77 L10.80 -56.80 L10.78 -57.72 L10.88 -58.52 L11.08 -59.15 L11.38 -59.62 Z M15.75 -58.11 L16.20 -58.16 L16.70 -58.04 L17.23 -57.74 L17.77 -57.29 L18.30 -56.68 L18.81 -55.95 L19.29 -55.11 L19.71 -54.18 L20.07 -53.20 L20.36 -52.20 L20.56 -51.20 L20.67 -50.24 L20.69 -49.35 L20.61 -48.55 L20.44 -47.86 L20.19 -47.31 L19.86 -46.92 L19.45 -46.69 L19.00 -46.64 L18.50 -46.76 L17.97 -47.06 L17.43 -47.51 L16.90 -48.12 L16.39 -48.85 L15.91 -49.69 L15.49 -50.62 L15.13 -51.60 L14.84 -52.60 L14.64 -53.60 L14.53 -54.56 L14.51 -55.45 L14.59 -56.25 L14.76 -56.94 L15.01 -57.49 L15.34 -57.88 Z M-14.5 -24.8 Q -32 -24 -52 -25 Q -32 -18 -11.5 -11.2 Z M1.29 -7.31 L1.12 -5.60 L0.43 -4.03 L-0.72 -2.74 L-2.20 -1.87 L-3.89 -1.51 L-5.60 -1.68 L-7.17 -2.37 L-8.46 -3.52 L-9.33 -5.00 L-9.69 -6.69 L-10.49 -20.69 L-10.32 -22.40 L-9.63 -23.97 L-8.48 -25.26 L-7.00 -26.13 L-5.31 -26.49 L-3.60 -26.32 L-2.03 -25.63 L-0.74 -24.48 L0.13 -23.00 L0.49 -21.31 Z M-18.60 -2.03 L-19.54 -2.05 L-20.42 -2.36 L-21.17 -2.93 L-21.70 -3.70 L-21.97 -4.60 L-21.95 -5.54 L-21.64 -6.42 L-21.07 -7.17 L-20.30 -7.70 L-19.40 -7.97 L-4.60 -9.97 L-3.66 -9.95 L-2.78 -9.64 L-2.03 -9.07 L-1.50 -8.30 L-1.23 -7.40 L-1.25 -6.46 L-1.56 -5.58 L-2.13 -4.83 L-2.90 -4.30 L-3.80 -4.03 Z M-32.96 4.94 L-33.62 5.17 L-34.30 5.18 L-34.96 4.98 L-35.53 4.58 L-35.94 4.04 L-36.17 3.38 L-36.18 2.70 L-35.98 2.04 L-35.58 1.47 L-35.04 1.06 L-20.04 -6.94 L-19.38 -7.17 L-18.70 -7.18 L-18.04 -6.98 L-17.47 -6.58 L-17.06 -6.04 L-16.83 -5.38 L-16.82 -4.70 L-17.02 -4.04 L-17.42 -3.47 L-17.96 -3.06 Z M17.44 -27.08 L17.70 -26.58 L17.80 -26.03 L17.72 -25.47 L17.47 -24.96 L17.08 -24.56 L16.58 -24.30 L16.03 -24.20 L15.47 -24.28 L14.96 -24.53 L14.56 -24.92 L11.56 -28.92 L11.30 -29.42 L11.20 -29.97 L11.28 -30.53 L11.53 -31.04 L11.92 -31.44 L12.42 -31.70 L12.97 -31.80 L13.53 -31.72 L14.04 -31.47 L14.44 -31.08 Z M19.88 -24.15 L20.17 -23.67 L20.30 -23.12 L20.25 -22.56 L20.02 -22.04 L19.65 -21.62 L19.17 -21.33 L18.62 -21.20 L18.06 -21.25 L17.54 -21.48 L17.12 -21.85 L14.62 -24.85 L14.33 -25.33 L14.20 -25.88 L14.25 -26.44 L14.48 -26.96 L14.85 -27.38 L15.33 -27.67 L15.88 -27.80 L16.44 -27.75 L16.96 -27.52 L17.38 -27.15 Z"/>
  </defs>

  <!-- Paper and a banded sky. -->
  <rect width="1024" height="1024" fill="#F3EDE0"/>
  <rect width="1024" height="1024" fill="url(#skyDots)" opacity="0.55"/>
  <rect y="330" width="1024" height="460" fill="url(#skyWarm)" opacity="0.75"/>
  <rect y="560" width="1024" height="230" fill="url(#skyLow)" opacity="0.7"/>

  <!-- The sun, with a ring of coarse dots for its glow. -->
  <circle cx="560" cy="480" r="400" fill="url(#skyLow)" opacity="0.35"/>
  <circle cx="560" cy="480" r="318" fill="#FFB511"/>
  <circle cx="560" cy="480" r="318" fill="url(#sunRed)" opacity="0.8"/>

  <!-- Mesas on the horizon, covering the sun's foot. -->
  <path d="M0 790 L0 690 L120 690 L140 668 L330 668 L352 700 L470 700 L470 790 Z" fill="#F3EDE0"/>
  <path d="M0 790 L0 690 L120 690 L140 668 L330 668 L352 700 L470 700 L470 790 Z" fill="#E9A57E"/>
  <path d="M0 790 L0 690 L120 690 L140 668 L330 668 L352 700 L470 700 L470 790 Z" fill="url(#mesaDots)" opacity="0.6"/>
  <path d="M640 790 L640 720 L690 720 L702 650 L760 650 L772 720 L1024 720 L1024 790 Z" fill="#E9A57E"/>
  <path d="M640 790 L640 720 L690 720 L702 650 L760 650 L772 720 L1024 720 L1024 790 Z" fill="url(#mesaDots)" opacity="0.6"/>
  <rect x="440" y="700" width="230" height="90" fill="#E9A57E"/>
  <rect x="440" y="700" width="230" height="90" fill="url(#mesaDots)" opacity="0.45"/>

  <!-- Red earth. -->
  <rect y="772" width="1024" height="252" fill="#FF6C2F"/>
  <path d="M0 880 Q 260 860 520 885 T 1024 870 L1024 1024 L0 1024 Z" fill="url(#earthDots)" opacity="0.55"/>
  <!-- Dry grass on the lip. -->
  <g fill="#FF4D03">
    <path d="M60 776 L72 752 L84 776 Z"/><path d="M180 776 L188 758 L198 776 Z"/><path d="M820 776 L832 750 L844 776 Z"/>
    <path d="M930 776 L938 760 L948 776 Z"/><path d="M380 776 L390 756 L400 776 Z"/>
  </g>
  <!-- Its shadow. -->
  <ellipse cx="570" cy="802" rx="150" ry="18" fill="url(#shadowDots)"/>

  <!-- The kangaroo: the paper cleared under it, orange solid, the blue plate's shade a few px off register. -->
  <g fill="#F3EDE0" stroke="#F3EDE0">
    <use xlink:href="#roo" transform="translate(600 690) scale(8.6)"/>
  </g>
  <g fill="#FF6C2F" stroke="#FF6C2F">
    <use xlink:href="#roo" transform="translate(600 690) scale(8.6)"/>
  </g>
  <g fill="url(#rooShade)" stroke="url(#rooShade)">
    <use xlink:href="#roo" transform="translate(607 695) scale(8.6)"/>
  </g>
  <!-- Belly, eye, nose, the joey's eye. -->
  <ellipse cx="669" cy="466" rx="56" ry="72" transform="rotate(-40 669 466)" fill="#FF9A6C"/>
  <ellipse cx="777" cy="296" rx="11" ry="12" fill="#3D5588"/>
  <ellipse cx="855" cy="313" rx="13" ry="10" fill="#3D5588"/>
  <ellipse cx="652" cy="418" rx="24" ry="21" fill="#FF6C2F"/>
  <ellipse cx="634" cy="392" rx="8" ry="20" transform="rotate(-25 634 392)" fill="#FF6C2F"/>
  <ellipse cx="660" cy="414" rx="5.5" ry="6.5" fill="#3D5588"/>

  <!-- Registration marks. -->
  <g fill="none" stroke-width="5">
    <g stroke="#3D5588"><circle cx="96" cy="96" r="30"/><path d="M46 96 H146 M96 46 V146"/></g>
    <g stroke="#FF6C2F" transform="translate(4 3)"><circle cx="96" cy="96" r="30"/><path d="M46 96 H146 M96 46 V146"/></g>
  </g>

  <!-- Uneven ink. -->
  <rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
