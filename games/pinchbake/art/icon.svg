    <ellipse cx="604" cy="624" rx="27" ry="19" transform="rotate(-25 604 624)"/>
    <ellipse cx="604" cy="624" rx="40" ry="28" transform="rotate(-25 604 624)"/>
  </g>
  <ellipse cx="474" cy="574" rx="14" ry="18" fill="#3B2219"/>
  <ellipse cx="550" cy="574" rx="14" ry="18" fill="#3B2219"/>
  <circle cx="469" cy="566" r="5.5" fill="#FFFFFF"/>
  <circle cx="545" cy="566" r="5.5" fill="#FFFFFF"/>
