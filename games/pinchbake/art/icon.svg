    <line x1="440" y1="320" x2="352" y2="452" stroke="url(#skin)" stroke-width="58" stroke-linecap="round"/>
    <line x1="568" y1="340" x2="668" y2="452" stroke="#C88964" stroke-width="60" stroke-linecap="round"/>
