    <path d="M512 362 C 592 362 664 416 670 496 C 674 540 658 540 650 568 C 642 596 628 578 614 604 C 600 630 582 612 560 628 C 536 646 518 622 494 634 C 468 644 456 620 434 626 C 410 630 398 606 382 596 C 364 586 366 562 356 542 C 346 520 350 498 354 480 C 368 410 438 362 512 362 Z" fill="url(#icing)" stroke="#C4614F" stroke-width="6"/>
