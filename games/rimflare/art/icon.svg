    <rect x="370" y="740" width="84" height="284"/><rect x="590" y="756" width="110" height="268"/><rect x="708" y="690" width="88" height="334"/>
    <rect x="804" y="790" width="120" height="234"/><rect x="930" y="730" width="94" height="294"/>
