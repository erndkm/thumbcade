  <path d="M318 560 C 318 520, 706 520, 706 560" fill="none" stroke="#EDE6DA" stroke-width="22" stroke-opacity="0.35"/>
  <path d="M318 560 C 318 612, 706 612, 706 560" fill="none" stroke="#EDE6DA" stroke-width="26" stroke-linecap="round"/>
  <path d="M340 586 C 420 606, 604 606, 684 586" fill="none" stroke="#FFA3CC" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
