<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030409"/>
      <stop offset="0.6" stop-color="#0A0E1E"/>
      <stop offset="1" stop-color="#17152A"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5AA8" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#EC1380" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#EC1380" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFB46A"/>
      <stop offset="0.55" stop-color="#E8762E"/>
      <stop offset="1" stop-color="#A8461A"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD36B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A1F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="118"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#C9D2EE" opacity="0.6">
    <rect x="96" y="118" width="6" height="6"/><rect x="250" y="70" width="5" height="5"/><rect x="860" y="96" width="6" height="6"/>
    <rect x="930" y="230" width="5" height="5"/><rect x="70" y="300" width="5" height="5"/><rect x="700" y="60" width="5" height="5"/>
  </g>
  <!-- skyline, a few windows awake -->
