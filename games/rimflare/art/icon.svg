  </g>
  <g fill="#FF5AA8"><path d="M520 170 C 532 200, 538 214, 532 236 C 524 220, 516 200, 520 170 Z"/><path d="M446 200 C 456 222, 458 238, 452 252 C 444 236, 440 220, 446 200 Z"/></g>
  <g transform="translate(512 468)">
    <circle r="118" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)" stroke="#1A120E" stroke-width="11" fill="none">
      <path d="M-118 0 H118"/><path d="M0 -118 V118"/>
      <path d="M-70 -110 C -20 -50, -20 50, -70 110"/><path d="M70 -110 C 20 -50, 20 50, 70 110"/>
