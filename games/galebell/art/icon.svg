<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0E1A30"/><stop offset="0.62" stop-color="#0A1220"/><stop offset="1" stop-color="#05080F"/></linearGradient>
<linearGradient id="beam" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#FFE3A0" stop-opacity="0.95"/><stop offset="0.3" stop-color="#FFB531" stop-opacity="0.5"/><stop offset="1" stop-color="#FFB531" stop-opacity="0.04"/></linearGradient>
<radialGradient id="ball" cx="0.36" cy="0.32" r="0.72"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.3" stop-color="#DCDFE6"/><stop offset="0.72" stop-color="#7A8091"/><stop offset="1" stop-color="#30343F"/></radialGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB531" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB531" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF4D6"/><stop offset="0.45" stop-color="#FFB531"/><stop offset="1" stop-color="#FFB531" stop-opacity="0"/></radialGradient>
<clipPath id="ballClip"><circle cx="420" cy="455" r="160"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<!-- the beam sweeping from the lamp -->
<path d="M 812 258 L -60 120 L -60 400 Z" fill="url(#beam)" opacity="0.9"/>
<path d="M 812 250 L 1120 150 L 1120 330 Z" fill="url(#beam)" opacity="0.35"/>
