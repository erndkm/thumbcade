<path d="M 0 850 Q 64 830 128 850 T 256 850 T 384 850 T 512 850 T 640 850 T 768 850 T 896 850 T 1024 850" fill="none" stroke="#2C8BA8" stroke-opacity="0.35" stroke-width="8"/>
