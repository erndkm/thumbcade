<circle r="20" fill="#06080D" stroke="#F3F0E8" stroke-width="6"/>
</g>
<!-- speed lines: the ball has just left the rubber -->
<g stroke="#FFB531" stroke-linecap="round">
<line x1="548" y1="560" x2="612" y2="636" stroke-width="14" stroke-opacity="0.55"/>
<line x1="510" y1="598" x2="556" y2="652" stroke-width="10" stroke-opacity="0.38"/>
<line x1="576" y1="512" x2="628" y2="572" stroke-width="8" stroke-opacity="0.25"/>
</g>
<!-- the ball, catching the lamp -->
<circle cx="420" cy="455" r="250" fill="url(#halo)"/>
<circle cx="420" cy="455" r="165" fill="#06080D"/>
<circle cx="420" cy="455" r="160" fill="url(#ball)"/>
