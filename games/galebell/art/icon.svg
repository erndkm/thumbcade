<line x1="120" y1="120" x2="104" y2="200"/><line x1="300" y1="60" x2="284" y2="140"/><line x1="560" y1="130" x2="544" y2="210"/>
<line x1="210" y1="330" x2="194" y2="410"/><line x1="660" y1="340" x2="644" y2="420"/><line x1="90" y1="560" x2="74" y2="640"/>
<line x1="960" y1="420" x2="944" y2="500"/><line x1="680" y1="700" x2="664" y2="780"/><line x1="380" y1="230" x2="364" y2="310"/>
