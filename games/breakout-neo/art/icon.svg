<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ballglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4D8DFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="1" stop-color="#0E1C46"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#floor)"/>
  <!-- perspective grid -->
  <g stroke="#4D8DFF" stroke-opacity="0.22" stroke-width="5">
    <line x1="512" y1="640" x2="-300" y2="1024"/><line x1="512" y1="640" x2="100" y2="1024"/>
    <line x1="512" y1="640" x2="512" y2="1024"/><line x1="512" y1="640" x2="924" y2="1024"/>
    <line x1="512" y1="640" x2="1324" y2="1024"/>
    <line x1="0" y1="760" x2="1024" y2="760"/><line x1="0" y1="860" x2="1024" y2="860"/><line x1="0" y1="980" x2="1024" y2="980"/>
  </g>
  <rect x="0" y="560" width="1024" height="120" fill="#070B1A"/>
  <!-- bricks: three rows, one gap where the ball broke through -->
  <g>
    <rect x="40" y="150" width="220" height="86" rx="18" fill="#4DF0FF"/>
    <rect x="282" y="150" width="220" height="86" rx="18" fill="#4DF0FF"/>
    <rect x="524" y="150" width="220" height="86" rx="18" fill="#4DF0FF"/>
    <rect x="766" y="150" width="220" height="86" rx="18" fill="#4DF0FF"/>
    <rect x="40" y="256" width="220" height="86" rx="18" fill="#4D8DFF"/>
    <rect x="282" y="256" width="220" height="86" rx="18" fill="#4D8DFF"/>
    <rect x="766" y="256" width="220" height="86" rx="18" fill="#4D8DFF"/>
    <rect x="40" y="362" width="220" height="86" rx="18" fill="#9B7BFF"/>
    <rect x="766" y="362" width="220" height="86" rx="18" fill="#9B7BFF"/>
    <g fill="#FFFFFF" opacity="0.5">
      <rect x="66" y="166" width="60" height="12" rx="6"/><rect x="308" y="166" width="60" height="12" rx="6"/>
      <rect x="550" y="166" width="60" height="12" rx="6"/><rect x="792" y="166" width="60" height="12" rx="6"/>
    </g>
  </g>
  <!-- shards -->
  <g fill="#9B7BFF">
    <rect x="560" y="300" width="34" height="34" transform="rotate(20 577 317)"/>
    <rect x="660" y="360" width="26" height="26" transform="rotate(-25 673 373)"/>
    <rect x="470" y="420" width="22" height="22" transform="rotate(40 481 431)"/>
  </g>
  <!-- ball + trail -->
  <g fill="#4D8DFF">
    <circle cx="430" cy="760" r="18" opacity="0.25"/>
    <circle cx="470" cy="690" r="24" opacity="0.4"/>
    <circle cx="510" cy="620" r="30" opacity="0.55"/>
  </g>
  <circle cx="580" cy="500" r="180" fill="url(#ballglow)"/>
  <circle cx="580" cy="500" r="54" fill="#FFFFFF"/>
  <!-- paddle -->
  <rect x="300" y="842" width="424" height="76" rx="38" fill="#13234D" stroke="#4D8DFF" stroke-width="16"/>
  <rect x="350" y="872" width="324" height="16" rx="8" fill="#9CC1FF"/>
</svg>
