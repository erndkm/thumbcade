    <path d="M640 548 Q 700 600 676 660 Q 652 610 610 566 Z" fill="#B8621B"/>
    <rect x="456" y="470" width="96" height="66" rx="8" fill="#FFE89A" transform="rotate(-10 504 503)"/>
