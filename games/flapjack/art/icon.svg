    <rect x="0" y="384" width="1024" height="6"/><rect x="0" y="512" width="1024" height="6"/>
    <rect x="0" y="640" width="1024" height="6"/><rect x="0" y="768" width="1024" height="6"/>
    <rect x="0" y="896" width="1024" height="6"/>
  </g>
  <!-- neon ring -->
