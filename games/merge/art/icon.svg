<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#120E1C"/>
  <g fill="#B48CFF" opacity="0.08">
    <rect x="96" y="150" width="56" height="14"/><rect x="117" y="129" width="14" height="56"/>
    <rect x="860" y="120" width="56" height="14"/><rect x="881" y="99" width="14" height="56"/>
    <rect x="80" y="860" width="56" height="14"/><rect x="101" y="839" width="14" height="56"/>
    <rect x="880" y="880" width="56" height="14"/><rect x="901" y="859" width="14" height="56"/>
  </g>
  <circle cx="512" cy="512" r="420" fill="#B48CFF" opacity="0.10"/>
  <!-- board -->
  <rect x="152" y="176" width="720" height="720" rx="64" fill="#0E0A17"/>
  <rect x="152" y="152" width="720" height="720" rx="64" fill="#1D1730"/>
  <!-- empty cells -->
  <g fill="#281F3F">
    <rect x="192" y="192" width="304" height="304" rx="44"/>
    <rect x="528" y="528" width="304" height="304" rx="44"/>
  </g>
  <!-- small tile sliding in from the left with speed lines -->
  <g fill="#D3C3FF" opacity="0.5">
    <rect x="60" y="600" width="110" height="22" rx="11"/>
    <rect x="30" y="660" width="140" height="22" rx="11"/>
    <rect x="80" y="720" width="90" height="22" rx="11"/>
  </g>
  <rect x="192" y="552" width="304" height="280" rx="44" fill="#9D88DB"/>
  <rect x="192" y="528" width="304" height="280" rx="44" fill="#D3C3FF"/>
  <!-- merged tile, popping -->
  <rect x="512" y="200" width="336" height="320" rx="50" fill="#5A35C2" transform="rotate(4 680 360)"/>
  <rect x="512" y="172" width="336" height="320" rx="50" fill="#8E62FF" transform="rotate(4 680 332)"/>
  <rect x="548" y="200" width="264" height="38" rx="19" fill="#FFFFFF" opacity="0.2" transform="rotate(4 680 219)"/>
  <!-- impact sparks -->
  <g fill="#FF7AC6">
    <rect x="470" y="470" width="40" height="40" transform="rotate(45 490 490)"/>
    <rect x="884" y="120" width="28" height="28" transform="rotate(45 898 134)"/>
    <rect x="440" y="140" width="24" height="24" transform="rotate(45 452 152)"/>
  </g>
  <g fill="#F3F0E8">
    <rect x="530" y="532" width="18" height="18" transform="rotate(45 539 541)"/>
    <rect x="900" y="560" width="22" height="22" transform="rotate(45 911 571)"/>
  </g>
</svg>
