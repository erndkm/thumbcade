<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#A6F23D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A6F23D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wake" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A6F23D" stop-opacity="0"/>
      <stop offset="1" stop-color="#A6F23D" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0B0F17"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- cutting-mat grid -->
  <g fill="#A6F23D" opacity="0.06">
    <rect x="127" y="0" width="3" height="1024"/><rect x="255" y="0" width="3" height="1024"/><rect x="383" y="0" width="3" height="1024"/>
    <rect x="511" y="0" width="3" height="1024"/><rect x="639" y="0" width="3" height="1024"/><rect x="767" y="0" width="3" height="1024"/><rect x="895" y="0" width="3" height="1024"/>
    <rect x="0" y="127" width="1024" height="3"/><rect x="0" y="255" width="1024" height="3"/><rect x="0" y="383" width="1024" height="3"/>
    <rect x="0" y="511" width="1024" height="3"/><rect x="0" y="639" width="1024" height="3"/><rect x="0" y="767" width="1024" height="3"/><rect x="0" y="895" width="1024" height="3"/>
  </g>
  <!-- board -->
  <rect x="100" y="470" width="824" height="480" rx="60" fill="#06080D"/>
  <rect x="100" y="446" width="824" height="480" rx="60" fill="#151B27"/>
  <g fill="#1B2331">
    <rect x="140" y="486" width="140" height="140" rx="24"/><rect x="298" y="486" width="140" height="140" rx="24"/><rect x="456" y="486" width="140" height="140" rx="24"/><rect x="614" y="486" width="140" height="140" rx="24"/><rect x="772" y="486" width="112" height="140" rx="24"/>
    <rect x="140" y="644" width="140" height="140" rx="24"/><rect x="298" y="644" width="140" height="140" rx="24"/><rect x="456" y="644" width="140" height="140" rx="24"/><rect x="614" y="644" width="140" height="140" rx="24"/><rect x="772" y="644" width="112" height="140" rx="24"/>
    <rect x="140" y="802" width="140" height="104" rx="24"/><rect x="298" y="802" width="140" height="104" rx="24"/><rect x="456" y="802" width="140" height="104" rx="24"/><rect x="614" y="802" width="140" height="104" rx="24"/><rect x="772" y="802" width="112" height="104" rx="24"/>
  </g>
  <!-- settled blocks -->
  <rect x="140" y="656" width="140" height="128" rx="24" fill="#3F8A6E"/><rect x="140" y="644" width="140" height="128" rx="24" fill="#7FD8B4"/>
  <rect x="298" y="814" width="140" height="92" rx="24" fill="#9C9A8E"/><rect x="298" y="802" width="140" height="92" rx="24" fill="#ECEADF"/>
  <rect x="140" y="814" width="140" height="92" rx="24" fill="#3F8A6E"/><rect x="140" y="802" width="140" height="92" rx="24" fill="#7FD8B4"/>
  <rect x="772" y="656" width="112" height="128" rx="24" fill="#5F9A1A"/><rect x="772" y="644" width="112" height="128" rx="24" fill="#A6F23D"/>
  <rect x="772" y="814" width="112" height="92" rx="24" fill="#5F9A1A"/><rect x="772" y="802" width="112" height="92" rx="24" fill="#A6F23D"/>
  <!-- the row ahead of the blade, still whole -->
  <rect x="614" y="498" width="140" height="128" rx="24" fill="#9C9A8E"/><rect x="614" y="486" width="140" height="128" rx="24" fill="#ECEADF"/>
  <rect x="634" y="502" width="100" height="18" rx="9" fill="#FFFFFF" opacity="0.55"/>
  <rect x="772" y="498" width="112" height="128" rx="24" fill="#5F9A1A"/><rect x="772" y="486" width="112" height="128" rx="24" fill="#A6F23D"/>
  <rect x="790" y="502" width="76" height="18" rx="9" fill="#FFFFFF" opacity="0.35"/>
  <!-- blocks the blade has passed: popping off as shards -->
  <g fill="#A6F23D">
    <rect x="160" y="350" width="74" height="74" rx="14" transform="rotate(-20 197 387)"/>
    <rect x="390" y="300" width="58" height="58" rx="11" transform="rotate(24 419 329)"/>
    <rect x="80" y="250" width="40" height="40" rx="8" transform="rotate(12 100 270)"/>
  </g>
  <g fill="#ECEADF">
    <rect x="300" y="380" width="62" height="62" rx="12" transform="rotate(16 331 411)"/>
    <rect x="250" y="230" width="36" height="36" rx="7" transform="rotate(-30 268 248)"/>
    <rect x="500" y="390" width="40" height="40" rx="8" transform="rotate(-12 520 410)"/>
  </g>
  <g fill="#7FD8B4">
    <rect x="452" y="230" width="46" height="46" rx="9" transform="rotate(38 475 253)"/>
    <rect x="120" y="440" width="34" height="34" rx="7" transform="rotate(-8 137 457)"/>
  </g>
  <!-- the blade -->
  <rect x="100" y="520" width="520" height="62" fill="url(#wake)" opacity="0.7"/>
  <rect x="120" y="545" width="500" height="12" rx="6" fill="#F3F0E8"/>
  <circle cx="606" cy="551" r="96" fill="#A6F23D" opacity="0.55" filter="url(#soft)"/>
  <rect x="590" y="452" width="32" height="198" rx="16" fill="#F3F0E8"/>
  <!-- the next piece, lifted, with its shadow on the board -->
  <g transform="translate(26 54) rotate(-6 720 230)" filter="url(#shadow)" opacity="0.5" fill="#000000">
    <rect x="594" y="96" width="140" height="140" rx="26"/><rect x="752" y="96" width="140" height="140" rx="26"/><rect x="752" y="254" width="140" height="140" rx="26"/>
  </g>
  <g transform="rotate(-6 720 230)">
    <rect x="594" y="110" width="140" height="128" rx="26" fill="#5F9A1A"/><rect x="594" y="96" width="140" height="128" rx="26" fill="#A6F23D"/>
    <rect x="752" y="110" width="140" height="128" rx="26" fill="#5F9A1A"/><rect x="752" y="96" width="140" height="128" rx="26" fill="#A6F23D"/>
    <rect x="752" y="268" width="140" height="128" rx="26" fill="#5F9A1A"/><rect x="752" y="254" width="140" height="128" rx="26" fill="#A6F23D"/>
    <g fill="#FFFFFF" opacity="0.4">
      <rect x="614" y="112" width="100" height="18" rx="9"/><rect x="772" y="112" width="100" height="18" rx="9"/><rect x="772" y="270" width="100" height="18" rx="9"/>
    </g>
  </g>
</svg>
