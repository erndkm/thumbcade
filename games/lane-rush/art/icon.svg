<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2F3A"/>
      <stop offset="0.38" stop-color="#3C5A66"/>
      <stop offset="0.56" stop-color="#C77B57"/>
      <stop offset="0.66" stop-color="#F2A65A"/>
    </linearGradient>
    <pattern id="stripe" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="64" height="64" fill="#FF6A1A"/>
      <rect width="32" height="64" fill="#F3F0E8"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="380" cy="600" r="210" fill="#FFC27A" opacity="0.45"/>
  <circle cx="380" cy="600" r="160" fill="#FFE3A3"/>
  <!-- mesas -->
  <path d="M0 640 L70 560 L230 560 L290 640 Z" fill="#7A5048"/>
  <path d="M640 640 L700 520 L900 520 L980 640 Z" fill="#5A3A3E"/>
  <rect x="0" y="636" width="1024" height="388" fill="#E7B98C"/>
  <!-- deck converging to the horizon -->
  <path d="M440 636 L584 636 L1024 1024 L0 1024 Z" fill="#4A4F5C"/>
  <path d="M440 636 L452 636 L60 1024 L0 1024 Z" fill="#FF6A1A"/>
  <path d="M572 636 L584 636 L1024 1024 L964 1024 Z" fill="#FF6A1A"/>
  <!-- lane dashes -->
  <g fill="#F3F0E8">
    <path d="M493 660 L498 660 L478 720 L470 720 Z"/>
    <path d="M462 760 L472 760 L440 860 L426 860 Z"/>
    <path d="M412 910 L428 910 L396 1024 L374 1024 Z"/>
    <path d="M526 660 L531 660 L554 720 L546 720 Z"/>
    <path d="M552 760 L562 760 L598 860 L584 860 Z"/>
    <path d="M596 910 L612 910 L650 1024 L628 1024 Z"/>
  </g>
  <!-- barricade -->
  <rect x="228" y="804" width="568" height="78" fill="url(#stripe)"/>
  <rect x="244" y="882" width="22" height="80" fill="#20232B"/>
  <rect x="758" y="882" width="22" height="80" fill="#20232B"/>
  <!-- runner mid-jump (from behind) -->
  <ellipse cx="512" cy="968" rx="120" ry="22" fill="#000" opacity="0.28"/>
  <g transform="rotate(-8 512 560)">
    <rect x="452" y="560" width="34" height="150" rx="17" fill="#2B2F3A" transform="rotate(28 469 570)"/>
    <rect x="540" y="560" width="34" height="130" rx="17" fill="#2B2F3A" transform="rotate(-36 557 570)"/>
    <rect x="430" y="400" width="164" height="190" rx="80" fill="#FF6A1A"/>
    <rect x="452" y="430" width="120" height="120" rx="20" fill="#20232B"/>
    <rect x="370" y="330" width="30" height="130" rx="15" fill="#2B2F3A" transform="rotate(-38 385 450)"/>
    <rect x="624" y="330" width="30" height="130" rx="15" fill="#2B2F3A" transform="rotate(38 639 450)"/>
    <circle cx="512" cy="352" r="62" fill="#FF6A1A"/>
    <path d="M500 410 C 540 440, 610 400, 700 430 L 704 452 C 620 430, 550 470, 496 436 Z" fill="#F3F0E8"/>
  </g>
</svg>
