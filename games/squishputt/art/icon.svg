<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="felt" cx="45%" cy="35%" r="80%">
      <stop offset="0" stop-color="#FBE9D4"/>
      <stop offset="0.6" stop-color="#F2D6B8"/>
      <stop offset="1" stop-color="#DDB48E"/>
    </radialGradient>
    <linearGradient id="rimTop" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F9BFA9"/>
      <stop offset="0.55" stop-color="#F2A08A"/>
      <stop offset="1" stop-color="#E5866F"/>
    </linearGradient>
    <linearGradient id="rimSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D77A64"/>
      <stop offset="1" stop-color="#B9604D"/>
    </linearGradient>
    <radialGradient id="green" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#C3DDB0"/>
      <stop offset="0.55" stop-color="#A8C795"/>
      <stop offset="1" stop-color="#7FA571"/>
    </radialGradient>
    <radialGradient id="cup" cx="50%" cy="62%" r="60%">
      <stop offset="0" stop-color="#1C110C"/>
      <stop offset="0.7" stop-color="#2E1C14"/>
      <stop offset="1" stop-color="#4C2E22"/>
    </radialGradient>
    <radialGradient id="ball" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFF8EC"/>
      <stop offset="0.8" stop-color="#EBDCC3"/>
      <stop offset="1" stop-color="#CDB596"/>
    </radialGradient>
    <radialGradient id="dent" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#C9B191" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#D9C6A8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pennant" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#F6D98B"/>
      <stop offset="1" stop-color="#E9BE5E"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A44"/>
      <stop offset="0.5" stop-color="#6E4533"/>
      <stop offset="1" stop-color="#4C2E22"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFE7B0"/>
      <stop offset="1" stop-color="#E2A957"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0.6" stop-color="#7A4A2C" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A4A2C" stop-opacity="0.32"/>
    </radialGradient>

    <!-- Hand-squished edges and a fine pressed texture. -->
    <filter id="lumpy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="clay" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="3" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="3.2" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="225" elevation="58"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="in" result="litc"/>
      <feBlend in="SourceGraphic" in2="litc" mode="multiply" result="m"/>
      <feComponentTransfer in="m">
        <feFuncR type="linear" slope="1.22" intercept="0"/>
        <feFuncG type="linear" slope="1.22" intercept="0"/>
        <feFuncB type="linear" slope="1.22" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="feltTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.16 0"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ridge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="ballClip"><circle cx="372" cy="712" r="128"/></clipPath>
    <clipPath id="greenClip"><rect x="166" y="380" width="700" height="520" rx="120" transform="rotate(-7 512 640)"/></clipPath>
  </defs>

  <!-- Felt tabletop -->
  <rect width="1024" height="1024" fill="url(#felt)"/>
  <rect width="1024" height="1024" filter="url(#feltTex)"/>

  <!-- The course slab's soft shadow on the felt -->
  <rect x="150" y="440" width="780" height="560" rx="150" transform="rotate(-7 512 640)" fill="#7A4A2C" opacity="0.38" filter="url(#soft)"/>

  <g filter="url(#lumpy)">
    <!-- Rim: side, then top -->
    <rect x="112" y="356" width="808" height="620" rx="160" transform="rotate(-7 512 640)" fill="url(#rimSide)"/>
    <rect x="112" y="318" width="808" height="620" rx="160" transform="rotate(-7 512 640)" fill="url(#rimTop)" filter="url(#clay)"/>
    <!-- Green, pressed into the rim -->
    <rect x="166" y="372" width="700" height="520" rx="120" transform="rotate(-7 512 640)" fill="#6F9563"/>
    <rect x="166" y="380" width="700" height="520" rx="120" transform="rotate(-7 512 640)" fill="url(#green)" filter="url(#clay)"/>
  </g>

  <!-- A big thumbprint pressed into the green -->
  <g clip-path="url(#greenClip)" filter="url(#ridge)" opacity="0.5" fill="none" stroke-linecap="round">
    <g transform="translate(700 790) rotate(-28)">
      <ellipse rx="150" ry="104" fill="#6F9563" opacity="0.28" stroke="none"/>
      <g stroke="#5E8452" stroke-width="7">
        <path d="M-128 6 A128 86 0 0 1 128 -6"/>
        <path d="M-108 12 A108 70 0 0 1 106 -2"/>
        <path d="M-88 14 A88 56 0 0 1 88 2"/>
        <path d="M-68 16 A68 42 0 0 1 66 4"/>
        <path d="M-48 14 A48 30 0 0 1 46 6"/>
        <path d="M-28 12 A28 18 0 0 1 26 6"/>
        <path d="M-118 30 A118 70 0 0 0 112 26"/>
        <path d="M-96 32 A96 54 0 0 0 92 28"/>
        <path d="M-72 30 A72 38 0 0 0 70 28"/>
      </g>
      <g stroke="#CFE6BF" stroke-width="4" opacity="0.7" transform="translate(0 -6)">
        <path d="M-118 8 A118 78 0 0 1 118 -4"/>
        <path d="M-78 15 A78 48 0 0 1 77 3"/>
        <path d="M-38 13 A38 24 0 0 1 36 6"/>
      </g>
    </g>
  </g>

  <!-- Cup: lip, well, light on the far wall -->
  <g transform="translate(652 512)">
    <ellipse rx="96" ry="62" fill="#F7EBD6" filter="url(#lumpy)"/>
    <ellipse rx="96" ry="62" fill="none" stroke="#D9C4A2" stroke-width="6" opacity="0.6"/>
    <ellipse rx="78" ry="48" fill="url(#cup)"/>
    <path d="M-66 -10 A72 40 0 0 1 66 -10 A70 30 0 0 0 -66 -10 Z" fill="#7A503C" opacity="0.8"/>
  </g>

  <!-- Flag shadow on the green -->
  <path d="M664 520 L860 600" stroke="#4E3124" stroke-width="18" stroke-linecap="round" opacity="0.22" filter="url(#softer)"/>
  <path d="M845 595 L960 600 L900 660 Z" fill="#4E3124" opacity="0.16" filter="url(#softer)"/>

  <!-- Flag -->
  <rect x="640" y="132" width="26" height="394" rx="13" fill="url(#pole)"/>
  <g filter="url(#lumpy)">
    <path d="M666 160 C760 172 836 196 892 236 C836 262 752 292 666 312 Z" fill="#E5866F"/>
    <path d="M666 148 C760 160 836 184 892 224 C836 250 752 280 666 300 Z" fill="url(#pennant)" filter="url(#clay)"/>
  </g>
  <circle cx="770" cy="226" r="20" fill="#FBF1DE" opacity="0.9"/>
  <circle cx="653" cy="128" r="30" fill="url(#knob)"/>
  <ellipse cx="644" cy="117" rx="10" ry="7" fill="#FFFFFF" opacity="0.6"/>

  <!-- Ball shadow, ball, thumbprint dent -->
  <ellipse cx="412" cy="838" rx="132" ry="44" fill="#4E3124" opacity="0.42" filter="url(#soft)"/>
  <ellipse cx="392" cy="826" rx="88" ry="24" fill="#3C2418" opacity="0.35" filter="url(#softer)"/>
  <g filter="url(#lumpy)">
    <circle cx="372" cy="712" r="128" fill="url(#ball)"/>
  </g>
  <g clip-path="url(#ballClip)">
    <g transform="translate(420 744) rotate(-24)">
      <ellipse rx="58" ry="44" fill="url(#dent)"/>
      <g fill="none" stroke="#A88B68" stroke-width="3.6" stroke-linecap="round" opacity="0.62" filter="url(#ridge)">
        <path d="M-48 4 A48 34 0 0 1 48 -4"/>
        <path d="M-37 7 A37 26 0 0 1 37 0"/>
        <path d="M-26 8 A26 18 0 0 1 26 2"/>
        <path d="M-15 7 A15 10 0 0 1 15 3"/>
        <path d="M-42 18 A42 24 0 0 0 40 16"/>
        <path d="M-28 18 A28 14 0 0 0 27 16"/>
      </g>
      <path d="M-50 -2 A50 36 0 0 1 50 -10" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" filter="url(#ridge)"/>
    </g>
  </g>
  <ellipse cx="322" cy="646" rx="40" ry="24" transform="rotate(-30 322 646)" fill="#FFFFFF" opacity="0.75" filter="url(#softer)"/>

  <!-- Photographed-on-a-table falloff -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
