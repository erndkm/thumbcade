<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A75A5F"/>
      <stop offset="0.42" stop-color="#D88A79"/>
      <stop offset="0.72" stop-color="#F4BE90"/>
      <stop offset="1" stop-color="#F7CFA2"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE2B4" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#FFD7A2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFD7A2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9C4" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="#FFC27A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFC27A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFC27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5A68C" stop-opacity="0"/>
      <stop offset="1" stop-color="#E5A68C" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- cloud streaks -->
  <ellipse cx="230" cy="420" rx="260" ry="9" fill="#FCE3CC" opacity="0.35"/>
  <ellipse cx="820" cy="250" rx="220" ry="7" fill="#FCE3CC" opacity="0.28"/>
  <ellipse cx="760" cy="470" rx="200" ry="6" fill="#FCE3CC" opacity="0.3"/>

  <!-- sun -->
  <circle cx="610" cy="600" r="420" fill="url(#bloom)"/>
  <circle cx="610" cy="600" r="178" fill="#FFDCAA"/>

  <!-- far mountains -->
  <path d="M0 700 L0 640 C60 620 110 560 170 572 C220 582 250 640 300 628 C360 612 400 540 470 548 C540 556 560 640 640 650 C720 660 760 590 830 580 C900 572 960 630 1024 612 L1024 1024 L0 1024 Z" fill="#C88F7B"/>
  <rect x="0" y="600" width="1024" height="200" fill="url(#fog1)"/>
  <!-- mid ridge with turbines -->
  <path d="M0 760 C80 740 140 712 220 718 C300 724 340 752 420 748 C520 742 560 706 660 712 C760 718 820 748 900 738 C960 731 1000 720 1024 722 L1024 1024 L0 1024 Z" fill="#A9766A"/>
  <g fill="#A9766A">
    <path d="M806 735 L809 610 L813 610 L816 735 Z"/>
    <circle cx="811" cy="610" r="6"/>
    <path d="M811 610 L815 606 L866 640 L860 646 Z"/>
    <path d="M811 610 L806 606 L794 548 L801 546 Z"/>
    <path d="M811 610 L810 616 L758 640 L756 633 Z"/>
    <path d="M146 732 L148 640 L151 640 L153 732 Z"/>
    <circle cx="149.5" cy="640" r="5"/>
    <path d="M149.5 640 L153 636 L180 600 L184 604 Z"/>
    <path d="M149.5 640 L154 643 L178 680 L172 683 Z"/>
    <path d="M149.5 640 L145 637 L106 650 L106 643 Z"/>
  </g>
  <rect x="0" y="690" width="1024" height="180" fill="url(#fog1)"/>
  <!-- forest layer -->
  <path d="M0 840 C100 812 180 806 260 820 C340 834 420 846 520 830 C620 814 700 800 800 812 C890 822 960 832 1024 826 L1024 1024 L0 1024 Z" fill="#7F534D"/>
  <g fill="#7F534D">
    <path d="M60 830 L76 770 L92 830 Z"/><path d="M86 826 L104 752 L122 826 Z"/><path d="M118 822 L132 778 L146 822 Z"/>
    <path d="M300 830 L318 762 L336 830 Z"/><path d="M332 834 L346 790 L360 834 Z"/>
    <path d="M610 820 L628 750 L646 820 Z"/><path d="M640 818 L656 768 L672 818 Z"/><path d="M668 816 L686 742 L704 816 Z"/>
    <path d="M880 826 L896 770 L912 826 Z"/><path d="M906 828 L922 784 L938 828 Z"/>
  </g>
  <rect x="0" y="790" width="1024" height="120" fill="url(#fog1)" opacity="0.7"/>
  <!-- near ground: the playfield ink -->
  <path d="M0 1024 L0 912 C90 896 170 900 240 914 C300 926 360 932 440 924 L470 1024 Z" fill="#1C0F15"/>
  <path d="M640 1024 L668 930 C740 916 820 906 900 912 C960 916 1000 922 1024 926 L1024 1024 Z" fill="#1C0F15"/>
  <g fill="#1C0F15">
    <path d="M64 912 L92 800 L100 830 L108 812 L116 846 L124 830 L140 906 Z"/>
    <path d="M140 908 L166 828 L174 852 L180 840 L196 912 Z"/>
    <path d="M776 916 L806 790 L814 822 L822 804 L830 840 L838 826 L860 912 Z"/>
    <path d="M860 912 L884 846 L890 864 L896 852 L912 912 Z"/>
    <rect x="356" y="880" width="12" height="52"/><rect x="380" y="868" width="12" height="62"/><rect x="404" y="896" width="12" height="34"/><rect x="350" y="862" width="56" height="10"/>
  </g>

  <!-- floating ruin with its lantern -->
  <path d="M196 92 L204 88 L226 90 L226 40 L246 36 L246 90 L300 92 L344 88 L344 62 L360 62 L360 90 L410 92 L452 96 L436 118 L412 140 L390 162 L366 190 L350 214 L334 196 L310 170 L280 150 L246 128 L218 112 Z" fill="#1C0F15"/>
  <path d="M260 132 Q262 152 256 168 M300 160 Q302 176 298 190 M392 160 Q390 172 394 184" stroke="#1C0F15" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="350" y1="212" x2="350" y2="262" stroke="#1C0F15" stroke-width="6" stroke-dasharray="12 8"/>
  <circle cx="350" cy="300" r="150" fill="url(#lamp)"/>
  <g transform="translate(350 300) scale(5.6)">
    <circle cx="0" cy="-9.5" r="1.8" fill="#1C0F15"/>
    <path d="M-6.5 -5 L0 -8.6 L6.5 -5 Z" fill="#1C0F15"/>
    <rect x="-4.6" y="-5" width="9.2" height="11.5" fill="#1C0F15"/>
    <path d="M-3 6.5 L3 6.5 L0 10 Z" fill="#1C0F15"/>
    <rect x="-2.9" y="-3.4" width="5.8" height="8.2" fill="#FFE2B6"/>
    <rect x="-0.45" y="-3.4" width="0.9" height="8.2" fill="#1C0F15"/>
  </g>

  <!-- a second lantern ahead, still dark -->
  <line x1="842" y1="0" x2="842" y2="276" stroke="#1C0F15" stroke-width="4" stroke-dasharray="9 6"/>
  <g transform="translate(842 300) scale(3.6)">
    <circle cx="0" cy="-9.5" r="1.8" fill="#1C0F15"/>
    <path d="M-6.5 -5 L0 -8.6 L6.5 -5 Z" fill="#1C0F15"/>
    <rect x="-4.6" y="-5" width="9.2" height="11.5" fill="#1C0F15"/>
    <path d="M-3 6.5 L3 6.5 L0 10 Z" fill="#1C0F15"/>
    <rect x="-2.9" y="-3.4" width="5.8" height="8.2" fill="#6A3A2A"/>
    <rect x="-0.45" y="-3.4" width="0.9" height="8.2" fill="#1C0F15"/>
  </g>

  <!-- the line -->
  <line x1="352" y1="352" x2="520" y2="520" stroke="#2A1416" stroke-width="4" stroke-linecap="round"/>

  <!-- the lamplighter, mid-swing in front of the sun: drawn hanging from the hands, then turned onto the line -->
  <g transform="translate(522 522) rotate(-45)">
    <!-- cloak streaming back against the swing -->
    <path d="M-10 60 C-30 62 -52 72 -84 82 C-74 86 -70 90 -68 98 C-50 92 -30 94 -8 104 Z" fill="#1C0F15"/>
    <!-- head in profile, hood point trailing -->
    <circle cx="-11" cy="47" r="13.5" fill="#1C0F15"/>
    <path d="M-16 36 L-36 34 L-22 54 Z" fill="#1C0F15"/>
    <!-- arms up to the grip, in front of the face -->
    <path d="M-4 0 L6 -1 L18 60 L2 62 Z" fill="#1C0F15"/>
    <ellipse cx="1" cy="0" rx="8" ry="7.5" fill="#1C0F15"/>
    <!-- coat -->
    <path d="M-20 60 L18 58 C20 92 22 122 26 150 L-16 152 C-18 120 -20 92 -20 60 Z" fill="#1C0F15"/>
    <!-- legs, knees a little bent, trailing back -->
    <path d="M-12 146 L6 146 L0 184 L-10 216 L-22 214 L-14 184 Z" fill="#1C0F15"/>
    <path d="M4 146 L22 146 L16 182 L8 210 L-4 208 L4 182 Z" fill="#1C0F15"/>
    <ellipse cx="-16" cy="217" rx="10" ry="5" transform="rotate(-12 -16 217)" fill="#1C0F15"/>
    <ellipse cx="3" cy="211" rx="10" ry="5" transform="rotate(-12 3 211)" fill="#1C0F15"/>
    <!-- the little lamp on the belt -->
    <circle cx="28" cy="128" r="34" fill="url(#lamp)"/>
    <circle cx="28" cy="128" r="5.5" fill="#FFE9C4"/>
  </g>

  <!-- seeds along the arc ahead -->
  <circle cx="700" cy="420" r="16" fill="#FFF0BE" opacity="0.22"/>
  <circle cx="700" cy="420" r="5" fill="#FFF6DA"/>
  <circle cx="760" cy="380" r="16" fill="#FFF0BE" opacity="0.22"/>
  <circle cx="760" cy="380" r="5" fill="#FFF6DA"/>
</svg>
