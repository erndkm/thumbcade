<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#0B0F14"/>
  <g fill="#FFFFFF" opacity="0.025">
    <rect x="0" y="96" width="1024" height="8"/><rect x="0" y="192" width="1024" height="8"/><rect x="0" y="288" width="1024" height="8"/>
    <rect x="0" y="384" width="1024" height="8"/><rect x="0" y="480" width="1024" height="8"/><rect x="0" y="576" width="1024" height="8"/>
    <rect x="0" y="672" width="1024" height="8"/><rect x="0" y="768" width="1024" height="8"/><rect x="0" y="864" width="1024" height="8"/>
  </g>
  <!-- the moment it turns: a half-red, half-aqua disc split by a lightning cut -->
  <circle cx="512" cy="512" r="372" fill="#00806F"/>
  <circle cx="512" cy="500" r="372" fill="#00E5C7"/>
  <path d="M 512 128 L 512 872 L 140 872 L 140 128 Z" fill="#0B0F14" opacity="0"/>
  <clipPath id="left"><path d="M 0 0 L 560 0 L 470 470 L 600 500 L 470 1024 L 0 1024 Z"/></clipPath>
  <g clip-path="url(#left)">
    <circle cx="512" cy="512" r="372" fill="#8F1F18"/>
    <circle cx="512" cy="500" r="372" fill="#FF4A3D"/>
  </g>
  <!-- reaction rings -->
  <circle cx="512" cy="500" r="430" fill="none" stroke="#00E5C7" stroke-width="18" opacity="0.35"/>
  <circle cx="512" cy="500" r="486" fill="none" stroke="#00E5C7" stroke-width="10" opacity="0.15"/>
  <!-- tap dot -->
  <circle cx="700" cy="660" r="70" fill="#F3F0E8"/>
  <circle cx="700" cy="660" r="110" fill="none" stroke="#F3F0E8" stroke-width="16" opacity="0.6"/>
  <!-- speed ticks -->
  <g fill="#F3F0E8">
    <rect x="300" y="300" width="70" height="22" rx="11" transform="rotate(-45 335 311)"/>
    <rect x="250" y="400" width="90" height="22" rx="11" transform="rotate(-20 295 411)"/>
  </g>
</svg>
