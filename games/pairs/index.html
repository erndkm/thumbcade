<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140A12" />
    <title>Pairs</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="bg"></canvas>
      <div id="hud">
        <div id="timebar"><div id="timefill"></div></div>
        <div id="row">
          <div id="score">0</div>
          <div id="level">LEVEL 1</div>
          <div id="combo">×1</div>
        </div>
      </div>
      <div id="grid"></div>
      <canvas id="fx"></canvas>
      <div id="banner"></div>
      <div id="attract">
        <div class="title">PAIRS</div>
        <div class="sub"><span>Peek · flip · match</span></div>
        <div class="best"><span id="best"></span></div>
        <div class="prompt"><i></i>TAP TO PLAY<i></i></div>
      </div>
      <div id="over"><div class="stamp" id="stamp">TIME</div><div class="prompt"><i></i>TAP TO PLAY AGAIN<i></i></div></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
