<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="rings" x="0" y="0" width="1" height="1" patternContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="#3A1530"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="#140A12"/>
  <g fill="#FF6FB5" opacity="0.10">
    <circle cx="150" cy="170" r="40"/><rect x="820" y="120" width="70" height="70" rx="8" transform="rotate(20 855 155)"/>
    <polygon points="150,860 210,960 90,960"/><circle cx="880" cy="880" r="54"/>
  </g>
  <!-- face-down card (back) -->
  <g transform="rotate(-12 400 520)">
    <rect x="206" y="250" width="388" height="500" rx="56" fill="#3A1530"/>
    <rect x="206" y="250" width="388" height="500" rx="56" fill="none" stroke="#FF6FB5" stroke-width="16" opacity="0.8"/>
    <g fill="none" stroke="#FF6FB5" stroke-opacity="0.45" stroke-width="14">
      <circle cx="400" cy="500" r="60"/><circle cx="400" cy="500" r="110"/><circle cx="400" cy="500" r="160"/>
    </g>
    <circle cx="400" cy="500" r="26" fill="#FF6FB5"/>
  </g>
  <!-- face-up card -->
  <g transform="rotate(10 640 520)">
    <rect x="446" y="268" width="388" height="500" rx="56" fill="#0D0D10" opacity="0.45" transform="translate(14 22)"/>
    <rect x="446" y="268" width="388" height="500" rx="56" fill="#221420"/>
    <rect x="446" y="268" width="388" height="500" rx="56" fill="none" stroke="#FF6FB5" stroke-width="18"/>
    <polygon points="640,368 683,456 780,470 710,538 726,634 640,588 554,634 570,538 500,470 597,456" fill="#5CF2B8"/>
  </g>
  <!-- spark -->
  <g fill="#F3F0E8">
    <rect x="852" y="300" width="20" height="74" rx="10"/><rect x="825" y="327" width="74" height="20" rx="10"/>
  </g>
</svg>
