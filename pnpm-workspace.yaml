packages:
  - apps/*
  - packages/*
  - services/*
  - games/*
  - scripts

# React Native / Metro is most reliable with a flat node_modules layout.
allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@radix-ui/react-dialog@1.3.1'
  - '@radix-ui/react-dismissable-layer@1.2.1'
  - '@radix-ui/react-dropdown-menu@2.2.1'
  - '@radix-ui/react-focus-scope@1.3.1'
  - '@radix-ui/react-menu@2.2.1'
  - '@radix-ui/react-roving-focus@1.2.1'
  - '@radix-ui/react-tabs@1.2.1'
  - '@radix-ui/react-tooltip@1.4.1'

nodeLinker: hoisted

# Never auto-install before `pnpm run`/`pnpm exec`: several agents share this workspace and
# installs must go through scripts/safe-install.sh.
verifyDepsBeforeRun: false
